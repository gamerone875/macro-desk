name: Macro Desk

on:
  schedule:
    - cron: "45 6 * * *"    # ~07:00 Casablanca
    - cron: "15 12 * * *"   # ~12:30
    - cron: "45 21 * * *"   # ~22:00
  workflow_dispatch:
    inputs:
      video_url:
        description: "Lien YouTube à analyser (optionnel)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: macro-desk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Update the desk
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MANUAL_URL: ${{ github.event.inputs.video_url }}
        run: python macro_desk.py

      - name: Save results
        if: always()
        run: |
          git config user.name "macro-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Macro Desk update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
